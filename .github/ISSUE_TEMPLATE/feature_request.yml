name: Feature request
description: Suggest an improvement based on a concrete workflow.
title: "[Feature]: "
body:
  - type: textarea
    id: workflow
    attributes:
      label: What are you trying to do?
      description: Explain the task and what currently makes it difficult.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Describe what should happen, including a small example.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Mention any approach you have already tried.
